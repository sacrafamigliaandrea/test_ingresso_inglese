<title>Dashboard Docente · Entry Test 2026-2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --uk-blue:#012169; --uk-blue-deep:#000F4D; --uk-blue-light:#E6EBF5;
    --uk-red:#C8102E; --uk-red-deep:#A40A24;
    --grigio:#5A5F6B; --grigio-bg:#F4F5F8; --bordo:#D7DBE3;
    --rosso-err:#B14444; --verde:#2E7D4F;
    --ombra-md:0 8px 24px rgba(1,33,105,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Atkinson Hyperlegible',system-ui,sans-serif;
    background:var(--grigio-bg);color:#1a1a1a;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    background-image:
      linear-gradient(45deg, transparent 48%, rgba(1,33,105,.025) 48%, rgba(1,33,105,.025) 52%, transparent 52%),
      linear-gradient(-45deg, transparent 48%, rgba(200,16,46,.025) 48%, rgba(200,16,46,.025) 52%, transparent 52%);
    background-size:80px 80px;
  }
  .login-card{
    max-width:460px;width:100%;
    background:#fff;border-radius:14px;padding:44px 40px;
    box-shadow:var(--ombra-md);border:1px solid var(--bordo);
    text-align:center;
    position:relative;overflow:hidden;
  }
  .login-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg, #fff 33%, var(--uk-red) 33% 66%, var(--uk-blue) 66%);
  }
  .logo-circle{
    width:72px;height:72px;border-radius:50%;
    background:var(--uk-blue);
    display:inline-flex;align-items:center;justify-content:center;
    margin-bottom:18px;
    box-shadow:0 4px 12px rgba(1,33,105,.25);
  }
  .logo-circle svg{width:46px;height:46px}
  h2{
    font-family:'EB Garamond',serif;color:var(--uk-blue);
    font-size:1.8rem;margin-bottom:8px;
  }
  .subt{color:var(--grigio);margin-bottom:6px;font-size:.95rem}
  .school{
    font-size:.75rem;letter-spacing:.08em;color:var(--grigio);
    text-transform:uppercase;font-weight:700;margin-bottom:28px;
  }
  .lock-icon{color:var(--uk-blue);width:22px;height:22px}
  input[type=password]{
    width:100%;padding:16px 18px;
    border:2px solid var(--bordo);border-radius:10px;
    font-family:inherit;font-size:1.1rem;font-weight:700;
    text-align:center;letter-spacing:.15em;
    transition:border-color .2s, box-shadow .2s;
    background:#FAFBFE;
  }
  input[type=password]:focus{
    outline:none;border-color:var(--uk-blue);
    box-shadow:0 0 0 4px var(--uk-blue-light);
    background:#fff;
  }
  button{
    width:100%;margin-top:14px;
    background:var(--uk-blue);color:#fff;
    padding:14px;border:none;border-radius:10px;
    font-family:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;
    transition:background .2s, transform .15s;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-height:52px;
  }
  button:hover:not(:disabled){background:var(--uk-blue-deep);transform:translateY(-1px)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .err{
    color:var(--rosso-err);font-weight:700;font-size:.9rem;
    margin-top:16px;min-height:22px;
  }
  .ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .spinner{
    display:inline-block;width:18px;height:18px;
    border:2.5px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .footer-note{
    margin-top:24px;font-size:.78rem;color:var(--grigio);
    border-top:1px solid var(--bordo);padding-top:14px;
  }
</style>
</head>

/* ============================================================
   CRYPTO — AES-256-GCM + PBKDF2 100k iterations
   ============================================================ */
function b64ToBytes(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
    keyMat,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

async function decryptData(b64Payload, password) {
  const all = b64ToBytes(b64Payload);
  const salt = all.slice(0, 16);
  const iv = all.slice(16, 28);
  const ct = all.slice(28);
  const key = await deriveKey(password, salt);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
  return new TextDecoder().decode(pt);
}

/* ============================================================
   UNLOCK
   ============================================================ */
async function unlock() {
  const pwd = document.getElementById('pwd').value.trim();
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  const btnContent = document.getElementById('btn-content');

  err.textContent = '';

  if (!pwd) { err.textContent = 'Inserisci la password.'; return; }
  if (ENCRYPTED_DATA === 'PLACEHOLDER') {
    err.textContent = 'Dashboard non ancora configurata (payload mancante).';
    return;
  }
  if (!window.crypto || !window.crypto.subtle) {
    err.textContent = 'Browser non supportato (serve HTTPS o localhost).';
    return;
  }

  btn.disabled = true;
  btnContent.innerHTML = '<span class="spinner"></span> Decifratura...';

  try {
    const html = await decryptData(ENCRYPTED_DATA, pwd);

    // Salva password per autenticarsi automaticamente verso Apps Script
    // (la dashboard plain controlla sessionStorage et_pwd al DOMContentLoaded)
    sessionStorage.setItem('et_pwd', pwd);
    sessionStorage.setItem('et_exp', String(Date.now() + 60 * 60 * 1000));

    // Iniezione HTML decifrato
    document.open();
    document.write(html);
    document.close();

  } catch (e) {
    btn.disabled = false;
    btnContent.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg> Accedi';
    err.textContent = 'Password errata.';
    console.error(e);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('pwd').addEventListener('keypress', e => {
    if (e.key === 'Enter') unlock();
  });
});
</script>
